# Files in conf.d/ are included in the http block, which is where these zones must be.
# ZC uploads replays one at a time, and at most once a week per changed replay.
limit_req_zone $binary_remote_addr zone=zc_replay_upload:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=zc_replay_upload_conn:10m;

server {
    listen      80;
    server_name api.zquestclassic.com;
    return 301 https://api.zquestclassic.com;
}

server {
    server_name api.zquestclassic.com;
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.zquestclassic.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.zquestclassic.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    location / {
        include uwsgi_params;
        uwsgi_pass unix:/home/zc/ZQuestClassic/api_server/zc.sock;
    }

    location /api/v1/replays/ {
        limit_req zone=zc_replay_upload burst=60 nodelay;
        limit_conn zc_replay_upload_conn 2;
        limit_req_status 429;
        limit_conn_status 429;

        # Just above MAX_UPLOAD_BYTES in api_server/server.py, which rejects the rest.
        client_max_body_size 30m;
        client_body_timeout 30s;

        include uwsgi_params;
        uwsgi_pass unix:/home/zc/ZQuestClassic/api_server/zc.sock;
    }
}
